const emptyProgress = () => ({ step: 'groups', group_id: null, student_id: null });
function inspectScores(scores, rubric) {
  let count = 0, total = 0;
  const errors = [];
  for (const item of rubric) {
    const value = scores[item.id];
    if (value === '' || value === null || value === undefined) continue;
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0 || value > item.max || !Number.isInteger(value * 2)) {
      errors.push(item.id);
    } else { count++; total += value; }
  }
  if (Object.keys(scores).some(key => !rubric.some(item => item.id === key))) errors.push('unknown');
  return { count, total, errors, complete: count === rubric.length && errors.length === 0 };
}
function newDraft() {
  return { scores: {}, comment: '', submitted: false, version: 0, dirty: false, mutation_id: null, conflict: false };
}
function editDraft(draft, patch) {
  return { ...draft, ...patch, submitted: false, dirty: true, mutation_id: crypto.randomUUID() };
}
function mergeRemote(localDrafts, remoteRows) {
  const result = { ...localDrafts };
  for (const remote of remoteRows) {
    const local = result[remote.student_id];
    if (!local?.dirty) result[remote.student_id] = { ...newDraft(), ...remote, dirty: false };
    else if (local.mutation_id === remote.mutation_id) result[remote.student_id] = { ...local, version: remote.version, dirty: false };
    else result[remote.student_id] = { ...local, conflict: local.version !== remote.version };
  }
  return result;
}
function acknowledge(current, sentMutation, response) {
  return { ...current, version: response.version, dirty: current.mutation_id !== sentMutation, conflict: false };
}
class LocalStore {
  constructor(storage, prefix = 'bsa-midterm:v1') { this.storage = storage; this.prefix = prefix; }
  read(key, fallback = null) {
    const raw = this.storage.getItem(`${this.prefix}:${key}`);
    if (!raw) return fallback;
    try { return JSON.parse(raw); } catch { throw new Error('本机记录无法读取。请先导出或联系老师，不要清除浏览器数据。'); }
  }
  write(key, value) {
    try { this.storage.setItem(`${this.prefix}:${key}`, JSON.stringify(value)); }
    catch { throw new Error('浏览器无法保存本机记录。请开启网站存储权限，或立即联网同步。'); }
  }
  remove(key) { this.storage.removeItem(`${this.prefix}:${key}`); }
}
function csvText(rows) {
  return '\uFEFF' + rows.map(row => row.map(value => {
    let text = String(value ?? '');
    if (/^[=+\-@\t\r]/.test(text)) text = "'" + text;
    return '"' + text.replaceAll('"', '""') + '"';
  }).join(',')).join('\r\n');
}
function summarize(students, raters, ratings, rubric) {
  const raterMap = new Map(raters.map(r => [r.id, r]));
  const avg = values => values.length ? Math.round(values.reduce((a,b) => a+b,0) / values.length * 100) / 100 : null;
  return students.map(student => {
    const rows = ratings.filter(r => r.student_id === student.id && r.submitted);
    const totals = role => rows.filter(r => {
      const rater = raterMap.get(r.rater_id);
      return rater?.role === role && (role === 'teacher' || rater.student_id !== student.id);
    }).map(r => inspectScores(r.scores, rubric).total);
    const peers = totals('student'), teachers = totals('teacher');
    return { ...student, peer_count: peers.length, peer_average: avg(peers), teacher_count: teachers.length, teacher_average: avg(teachers), self_count: rows.filter(r => raterMap.get(r.rater_id)?.student_id === student.id).length };
  });
}



class CloudAPI {
  constructor(config) {
    this.url = (config.supabaseUrl || '').replace(/\/$/, '');
    this.key = config.supabasePublicKey || '';
  }
  get configured() {
    if (!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(this.url)) return false;
    if (this.key.startsWith('sb_publishable_')) return true;
    if (this.key.startsWith('eyJ')) {
      try { return JSON.parse(atob(this.key.split('.')[1].replaceAll('-','+').replaceAll('_','/'))).role === 'anon'; }
      catch { return false; }
    }
    return false;
  }
  async rpc(name, params = {}) {
    if (!this.configured) throw new Error('网站尚未连接评分数据库，请联系老师完成配置。');
    const headers = { apikey: this.key, 'Content-Type': 'application/json' };
    if (this.key.startsWith('eyJ')) headers.Authorization = `Bearer ${this.key}`;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(`${this.url}/rest/v1/rpc/${name}`, { method: 'POST', headers, body: JSON.stringify(params), signal: controller.signal, cache: 'no-store' });
      const data = await response.json();
      if (!response.ok || data?.error) {
        const err = new Error(data.error || data.message || '云端请求失败，请稍后重试。');
        err.code = data.message?.includes('CONFLICT') ? 'CONFLICT' : data.message?.includes('SESSION_EXPIRED') ? 'SESSION_EXPIRED' : 'REQUEST_FAILED';
        throw err;
      }
      return data;
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('连接超时，评分保留在本机，联网后会重试。');
      throw error;
    } finally { clearTimeout(timeout); }
  }
  login(name, number) { return this.rpc('score_login', { p_name: name, p_student_number: number }); }
  bootstrap(token) { return this.rpc('score_bootstrap', { p_token: token }); }
  save(token, student, draft) { return this.rpc('score_save_rating', { p_token: token, p_student_id: student, p_scores: draft.scores, p_comment: draft.comment, p_submitted: draft.submitted, p_expected_version: draft.version, p_mutation_id: draft.mutation_id }); }
  progress(token, progress) { return this.rpc('score_save_progress', { p_token: token, p_progress: progress }); }
  admin(token) { return this.rpc('score_admin_export', { p_token: token }); }
}

  async login(name, number) {
    const student = STUDENTS.find(s => s.name === name);
    const teacher = name === '熊睿' && number === '920698';
    if (!teacher && (!student || number === '920698' || !/^\d{4,20}$/.test(number))) throw new Error('请选择名单中的姓名，并输入4—20位数字学号。');
    const data = this.read();
    let rater = data.raters.find(r => r.student_number === number);
    if (rater && rater.name !== name) throw new Error('该演示学号已由其他姓名使用。');
    if (!rater) { rater = { id: crypto.randomUUID(), name, student_number: number, role: teacher ? 'teacher' : 'student', student_id: student?.id ?? null }; data.raters.push(rater); this.write(data); }
    return { token: rater.id, rater };
  }
  async bootstrap(token) {
    const data = this.read(), rater = data.raters.find(r => r.id === token);
    if (!rater) throw new Error('演示身份已失效，请重新进入。');
    return { rater, students: STUDENTS, rubric: RUBRIC, ratings: data.ratings.filter(r => r.rater_id === token), progress: data.progress[token] || null };
  }
  async save(token, student, draft) {
    const data = this.read();
    let row = data.ratings.find(r => r.rater_id === token && r.student_id === student);
    if (row?.mutation_id === draft.mutation_id) return row;
    if ((row?.version || 0) !== draft.version) { const e = new Error('CONFLICT'); e.code = 'CONFLICT'; throw e; }
    const saved = { ...newDraft(), ...draft, student_id: student, rater_id: token, version: (row?.version || 0) + 1, updated_at: new Date().toISOString() };
    if (row) Object.assign(row, saved); else data.ratings.push(saved);
    this.write(data); return saved;
  }

const demo = new URLSearchParams(location.search).get('demo') === '1';
const api = demo ? new DemoAPI(localStorage) : new CloudAPI(window.SCORING_CONFIG || {});
const store = new LocalStore(localStorage, demo ? 'bsa-midterm-demo:v1' : 'bsa-midterm:v1');
const app = document.querySelector('#app');
const state = { session: null, students: STUDENTS, rubric: RUBRIC, drafts: {}, progress: emptyProgress(), progress_dirty: false, storageError: '', error: '', syncing: false, admin: null };

function persist() {

}
function pending() { return state.progress_dirty || Object.values(state.drafts).some(d => d.dirty); }

  if (state.syncing) return '正在同步到云端…';
  if (state.error) return `本机已保留 · ${state.error}`;
  if (pending()) return '本机已保存 · 等待云端同步';

function paintStatus() {

function saveSoon() { persist(); paintStatus(); clearTimeout(saveTimer); saveTimer = setTimeout(sync, 650); }
async function sync() {

        while (state.drafts[id]?.dirty && !state.drafts[id].conflict && passes++ < 8) {
          const sent = structuredClone(state.drafts[id]);
          if (inspectScores(sent.scores, state.rubric).errors.length) break;

            const response = await api.save(state.session.token, Number(id), sent);

        await api.progress(state.session.token, JSON.parse(sent));
        if (JSON.stringify(state.progress) === sent) state.progress_dirty = false;
        persist();
      }
    } catch (error) {
      state.error = error.code === 'CONFLICT' ? '其他设备有新版本，请处理评分冲突' : error.message;
      if (error.code === 'SESSION_EXPIRED') state.error = '登录已过期，请重新输入姓名和学号；本机评分仍保留';
    } finally { state.syncing = false; paintStatus(); }

function go(step, patch = {}) { state.admin = null; state.progress = { ...state.progress, ...patch, step }; state.progress_dirty = true; saveSoon(); render(); sync(); window.scrollTo({ top: 0 }); }
function raterLabel() { return state.session?.rater.role === 'teacher' ? '教师' : '学生'; }

}
function syncBar() { return `<div class="sync-bar"><span data-save-status class="save-status"></span><button class="text-button" data-action="sync">立即同步</button></div>`; }
function render() {

function renderLogin() {

async function loadSession(session) {
  const bootstrap = await api.bootstrap(session.token);
  const local = store.read(`account:${session.rater.id}`, {});
  state.session=session; state.students=orderRoster(bootstrap.students); state.rubric=bootstrap.rubric;
  state.drafts=mergeRemote(local.drafts || {}, bootstrap.ratings || []);
  state.progress=local.progress_dirty ? local.progress : bootstrap.progress || local.progress || emptyProgress();
  const correctedProgress=normalizeRosterProgress(state.progress,state.students);
  state.progress_dirty=!!local.progress_dirty || correctedProgress.group_id!==state.progress.group_id;
  state.progress=correctedProgress;
  store.write('session', session); persist(); render(); sync();
}
function orderRoster(students) {
  const order = new Map(STUDENTS.map((student, index) => [student.id, index]));
  return [...students].sort((a,b) => (order.get(a.id) ?? 999) - (order.get(b.id) ?? 999));
}
function normalizeRosterProgress(progress, students) {
  const result = { ...progress };
  const student = students.find(item => item.id === Number(result.student_id));
  if (student) result.group_id = student.group_id;
  return result;
}
function renderGroups() {

  }).join('')}</div><div class="actions"><span class="muted">共 7 组 · 31 位同学</span><button class="primary" data-action="to-students" ${!state.progress.group_id?'disabled':''}>下一步 · 选择展示学生 →</button></div>${state.session.rater.role==='teacher'?'<button class="text-button" data-action="admin">教师查看评分与导出 →</button>':''}`;

function renderRating() {

  }).join('')}<div class="panel comment-panel"><label class="field">给展示同学的建议 <span class="muted">选填</span><textarea name="comment" id="comment" maxlength="1000" placeholder="可以写下一条具体的改进建议…">${escape(draft.comment)}</textarea></label></div><div class="rating-footer"><div><div class="total"><span id="score-total">0</span> <small>/ 100 分 · <span id="score-count">0</span>/15 项</small></div><div data-save-status class="save-status"></div></div><button class="primary" type="submit">保存并选择下一位 →</button></div><p class="footnote">未填完也可返回，草稿会自动保存。评分对象与评分人分别记录；自评会单独标记。</p></form>`;
